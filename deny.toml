# Configuration for cargo-deny

[graph]
# Check with every workspace feature enabled, so a dependency
# behind an off-by-default feature is still checked.
all-features = true

[licenses]
# Licenses acceptable for redistribution with our GPL-3.0-or-later
# binary. Every dependency must match at least one entry.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MITNFA",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# unescaper declares "GPL-3.0/MIT", the pre-SPDX-2.0 slash form,
# which cargo-deny cannot parse and warns about. State the
# expression in valid SPDX. The hashes fix the crate's license
# files, so a licensing change upstream fails the check instead
# of passing silently. Delete when upstream fixes its metadata.
[[licenses.clarify]]
crate = "unescaper"
expression = "GPL-3.0-only OR MIT"
license-files = [
    { path = "LICENSE-GPL3", hash = 0xe497def1 },
    { path = "LICENSE-MIT", hash = 0xeb164a42 },
]

[bans]
# Refuse wildcard version requirements. Every dependency must
# name a range.
wildcards = "deny"
# Duplicate crate versions arise when dependencies require
# incompatible versions of a shared crate. Not actionable, so
# don't warn. Use `cargo tree -d` to list them.
multiple-versions = "allow"

[sources]
# Every dependency must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"

# Advisory exceptions for the audit recipe. Every entry names its
# RUSTSEC id and the reason the advisory stays open.
# paste is unmaintained with no fixed release. Its only path into
# the tree is utoipa-axum, whose newest release still depends on
# it. Delete this entry when utoipa-axum ships without paste.
[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = "waiting on a paste-free utoipa-axum release"
